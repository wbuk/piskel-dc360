# Builds Piskel (https://github.com/piskelapp/piskel, Apache-2.0) and publishes it as a release, because Piskel
# itself has not published built releases since 2018. DC360 Libraries (Libraries > Apps) checks these releases,
# downloads piskel-dc360.zip and applies DC360's own changes on the DC360 server. Nothing DC360-specific is here.
#
# Runs every night: if Piskel's master branch has a new commit, it is built with Piskel's own build
# (npm run build) and released as vYYYY.MMDD.HHMM (the time of that commit, UTC), so newer is always higher.
name: Build Piskel

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HUSKY: '0'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out Piskel (master)
        uses: actions/checkout@v4
        with:
          repository: piskelapp/piskel
          ref: master
          path: piskel

      - name: Work out the version
        id: ver
        run: |
          cd piskel
          SHA=$(git rev-parse HEAD)
          VERSION=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m%d.%H%M)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:'%d %b %Y %H:%M UTC')" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Piskel has not changed since v$VERSION: nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.ver.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Piskel
        if: steps.ver.outputs.exists == 'false'
        working-directory: piskel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          rm -rf dest/prod/piskelapp-partials
          cp LICENSE dest/prod/LICENSE.txt
          printf '{"source":"piskelapp/piskel","commit":"%s","version":"%s","built":"%s"}\n' \
            "${{ steps.ver.outputs.sha }}" "${{ steps.ver.outputs.version }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dest/prod/piskel-build.json
          cd dest/prod && zip -qr "$GITHUB_WORKSPACE/piskel-dc360.zip" .

      - name: Check the build
        if: steps.ver.outputs.exists == 'false'
        run: |
          unzip -l piskel-dc360.zip | grep -q ' index.html$'
          unzip -l piskel-dc360.zip | grep -q 'js/piskel-packaged-min'
          unzip -l piskel-dc360.zip | grep -q 'css/piskel-style-packaged'

      - name: Publish the release
        if: steps.ver.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" piskel-dc360.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Piskel ${{ steps.ver.outputs.version }}" \
            --notes "Piskel built from piskelapp/piskel master, commit ${{ steps.ver.outputs.sha }} (${{ steps.ver.outputs.date }}). Piskel is by Julian Descottes and contributors, Apache License 2.0 (LICENSE.txt in the zip)."

      # GitHub switches off nightly jobs in a repository with no activity for 60 days. On the 1st of each month
      # this records the last check, which keeps the nightly build running even when Piskel has not changed.
      - name: Keep the nightly build switched on
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > last-check.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add last-check.txt
            git commit -m "Monthly check (keeps the nightly build switched on)"
            git push
          fi
